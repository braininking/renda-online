name: Atualizar ofertas automaticamente

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Atualizar ofertas
        run: node scripts/update-offers.mjs

      - name: Publicar novas ofertas no GitHub
        run: |
          git config user.name "OfertaRadar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offers.json seen-offers.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas ofertas."
            exit 0
          fi
          git commit -m "chore: atualizar ofertas automaticamente"
          git push
